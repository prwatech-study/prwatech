server.port=9090
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# JSON dates as ISO strings (2026-05-20T16:44:11), not [2026,5,20,...] arrays
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

swagger.enabled=${SWAGGER_ENABLED:true}
swagger.user=${SWAGGER_USER:dev}
swagger.password=${SWAGGER_PASSWORD:dev-only-change-me}

#-------------------------------------- Db Configuration ----------------------------------------
#spring.data.mongodb.host=localhost
#spring.data.mongodb.port=27017
spring.data.mongodb.database=prwatechDB
spring.jpa.hibernate.ddl-auto=update

# Local default has no credentials. Production MUST set SPRING_DATA_MONGODB_URI.
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/prwatechDB}

#-------------------------------------- JWT Configuration ------------------------------------------------
# Signing key for login tokens. Set JWT_SECRET_KEY in production to a strong random value —
# rotating it invalidates every active session across all users immediately.
jwt.secret.key=${JWT_SECRET_KEY:local-dev-only-not-for-production}

#-------------------------------------- Auth0 Configuration ---------------------------------------------
prwatech.auth0.client.domain=${PRWATECH_AUTH0_CLIENT_DOMAIN:dev-qjflqhtx8e1jzw3z.au.auth0.com}
prwatech.auth0.client.id=${PRWATECH_AUTH0_CLIENT_ID:Yqvh3NgrDSkroN3Ikw0eHKU6PpeELFFO}
prwatech.auth0.client.secret.key=${PRWATECH_AUTH0_CLIENT_SECRET:}
prwatech.rz.key=${PRWATECH_RZ_KEY:}
prwatech.rz.secret=${PRWATECH_RZ_SECRET:}

prwatech.twilio.account.sid=${PRWATECH_TWILIO_ACCOUNT_SID:}
prwatech.twilio.account.auth.token=${PRWATECH_TWILIO_AUTH_TOKEN:}

#-------------------------------------- Encoder ----------------------------------------------------------
# Cost/format prefix only ($$ escapes literal $ for Spring). Not a shared password salt.
bcrypt.password.salt=${BCRYPT_PASSWORD_SALT:$$2a$$10$$localdevplaceholder12}

#----------------------------------------- fast to sms -----------------------------------------------------
prwatech.fast.to.sms.api.key=${PRWATECH_FAST2SMS_API_KEY:}
prwatech.email.access.key=${PRWATECH_EMAIL_ACCESS_KEY:}
prwatech.fast.to.sms.api.sender.id=${PRWATECH_FAST2SMS_SENDER_ID:PRWATK}
prwatech.fast.to.sms.api.message=${PRWATECH_FAST2SMS_MESSAGE_ID:187840}
prwatech.fast.to.sms.api.route=${PRWATECH_FAST2SMS_ROUTE:dlt}

#----------------------------------------- Application Keys -----------------------------------------------
spring.mail.host=${SPRING_MAIL_HOST:smtp.office365.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:support@prwatech.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.transport.protocol=smpt
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
prwatech.default.email.id=${PRWATECH_DEFAULT_EMAIL_ID:support@prwatech.com}
prwatech.default.sale.email.id=${PRWATECH_DEFAULT_SALE_EMAIL_ID:sale@prwatech.com}

#--------------------------Course Category Id----------------------------------
it-course.category.id = 5d81b36cfa00f46163fd0018

# Skillama DB — local default has no credentials. Production MUST set SKILLAMA_MONGODB_URI.
skillama.mongodb.uri=${SKILLAMA_MONGODB_URI:mongodb://localhost:27017/skillamaDB}

# Build @Indexed indexes on startup. Index creation runs against live data, so a duplicate on
# a unique-indexed field aborts startup: run scripts/check-mongo-unique-indexes.js first.
# Set to false to boot without touching indexes.
skillama.mongodb.auto-index-creation=${SKILLAMA_MONGO_AUTO_INDEX:true}

# Rate limits for the unauthenticated org endpoints, requests per minute per caller IP (0 disables).
# Counters are per instance; use an edge limit if you need a hard global cap.
skillama.ratelimit.org-branding-per-minute=${SKILLAMA_RATELIMIT_ORG_BRANDING:60}
skillama.ratelimit.org-resolve-per-minute=${SKILLAMA_RATELIMIT_ORG_RESOLVE:300}

# Skillama Base URL for activation links
skillama.base.url=https://prwatech.xyz

# Public learner app URL (referral signup links, course share links)
skillama.app.public-url=${SKILLAMA_APP_PUBLIC_URL:https://skillama.co.in}

# Freemium upgrade outreach (shown in learner UI + upgrade-interest emails)
skillama.upgrade.contact-email=${SKILLAMA_UPGRADE_CONTACT_EMAIL:hello@skillama.co.in}
skillama.upgrade.contact-message=Paid and enterprise access is provisioned by the internal Skillama team. Email us with the account you use to sign in; we will reach out to help you upgrade.
skillama.upgrade.mailto-subject=Skillama full access request

# OAuth (Google sign-in for LMS; Apple disabled for now)
skillama.oauth.google.client-id=${SKILLAMA_GOOGLE_CLIENT_ID:816496582277-pi437ic6nd2th004ve2ko8qjp70ce1j6.apps.googleusercontent.com}
skillama.oauth.apple.client-id=${SKILLAMA_APPLE_CLIENT_ID:}

# File upload
# - Curriculum images, thumbnails & demo video → presentation-image-courses bucket
# - Downloadable study materials (PDF, DOC, ZIP) → skillama-course-materials bucket (separate)
# - file.upload.base-url is only if uploadImage() saves to disk under /files/** (dev fallback).
file.upload.directory=uploads
file.upload.base-url=${FILE_UPLOAD_BASE_URL:https://prwatech.xyz/files}
file.upload.s3.base-url=https://presentation-image-courses.s3.ap-south-1.amazonaws.com
file.upload.s3.demo-video-prefix=demo-video
file.upload.s3.study-materials-base-url=${STUDY_MATERIALS_S3_BASE_URL:https://skillama-course-materials.s3.ap-south-1.amazonaws.com}
file.upload.s3.study-materials-prefix=courses

aws.s3.bucket-name=presentation-image-courses
aws.s3.study-materials-bucket-name=${STUDY_MATERIALS_S3_BUCKET:skillama-course-materials}
# Corporate branding images — shared public bucket (same as course images). Dedicated
# skillama-org-{slug} buckets need s3:CreateBucket, which production IAM does not grant.
aws.s3.org-assets.bucket-name=${ORG_ASSETS_S3_BUCKET:presentation-image-courses}
aws.s3.org-assets.dedicated-buckets=${ORG_ASSETS_DEDICATED_BUCKETS:false}
aws.s3.org-assets.bucket-prefix=${ORG_ASSETS_S3_BUCKET_PREFIX:skillama-org-}
aws.s3.org-assets.create-bucket=${ORG_ASSETS_S3_CREATE_BUCKET:false}
# Practical-exercise CSV datasets — private bucket, no base-url property on purpose: every read
# goes through PracticalDatasetService/FileStorageService, never a direct link.
aws.s3.practical-datasets-bucket-name=${PRACTICAL_DATASETS_S3_BUCKET:skillama-practical-datasets}
aws.s3.region=ap-south-1

# Malware scan invoked synchronously before an uploaded dataset ever reaches S3 — see
# lambda/clamav-scanner and lambda/practical-sandbox/terraform/clamav.tf.
aws.lambda.clamav-scanner-function-name=${CLAMAV_SCANNER_FUNCTION_NAME:skillama-practical-sandbox-clamav-scanner}

# Code-execution sandbox — see lambda/practical-sandbox and PracticalSandboxService.
aws.lambda.practical-sandbox-function-name=${PRACTICAL_SANDBOX_FUNCTION_NAME:skillama-practical-sandbox-python}

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Tomcat default max HTTP POST body is 2MB — without this, multipart demo-video uploads >2MB return 413 before Spring runs.
# If 413 persists after deploy, raise the reverse proxy limit too (e.g. nginx client_max_body_size).
server.tomcat.max-http-form-post-size=500MB
server.tomcat.max-swallow-size=500MB

spring.mvc.contentnegotiation.favor-path-extension=false
spring.mvc.contentnegotiation.favor-parameter=false
spring.mvc.default-content-type=application/json

# AI usage ingest from ai-tutor (set the same AI_USAGE_API_KEY on both services)
skillama.ai-usage.internal-api-key=${AI_USAGE_API_KEY:}

# Firebase Cloud Messaging — path to a gitignored service-account JSON, or the JSON itself.
# Do not put the private key in this file. See firebase-service-account.json.example.
firebase.credentials.file=${FIREBASE_CREDENTIALS_FILE:}
firebase.credentials.json=${FIREBASE_CREDENTIALS_JSON:}

# Live USD → INR for AI cost display (Frankfurter / ECB; refreshed hourly in-memory)
skillama.exchange-rate.api-url=https://api.frankfurter.app/latest?from=USD&to=INR

# AI lecture-image generation (backend -> ai-tutor Flask /generate_image)
# Routes to dev-base-url when the platform devMode flag is on (mirrors frontend).
skillama.ai.base-url=${SKILLAMA_AI_BASE_URL:https://ai.prwatech.com}
skillama.ai.dev-base-url=${SKILLAMA_AI_DEV_BASE_URL:https://dev-ai.prwatech.com}
# Backend -> ai-tutor auth (set same value on ai-tutor as INTERNAL_SERVICE_KEY).
# ai-tutor only rejects on a mismatch once its ENFORCE_INTERNAL_AUTH is turned on —
# leave that off until every browser-direct ai-tutor route has a backend proxy.
skillama.ai.internal-key=${SKILLAMA_AI_INTERNAL_KEY:}

# Knowledge base (Bedrock admin sync)
skillama.kb.sync-secret=${KB_SYNC_SECRET:}
skillama.kb.owner-approval-usd=${KB_OWNER_APPROVAL_USD:2}
skillama.kb.embed-rate-per-mtoken=${KB_EMBED_RATE_PER_MTOKEN:0.02}
file.upload.s3.knowledge-base-prefix=knowledge-base
# Off-switch: when false the backend refuses generate/commit (frontend also hides the button).
skillama.ai.image-generation.enabled=${SKILLAMA_AI_IMAGE_GEN_ENABLED:true}
# Per-submodule generations allowed per day (India time); resets at midnight.
skillama.ai.image-generation.daily-cap=${SKILLAMA_AI_IMAGE_GEN_DAILY_CAP:3}

# Billing gateway: mock (default) | razorpay (future)
skillama.payment.provider=mock

# Investor demo login: OTP emailed to the owner. Defaults enable the demo on
# every environment running this file; env vars still override per environment
# (set either to empty to disable there).
skillama.demo.otp-email=${SKILLAMA_DEMO_OTP_EMAIL:jitendrachandwani27@gmail.com}
skillama.demo.user-email=${SKILLAMA_DEMO_USER_EMAIL:jitendrachandwani27@gmail.com}
