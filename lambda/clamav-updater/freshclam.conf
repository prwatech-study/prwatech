# Minimal freshclam config — the packaged default requires uncommenting an "Example" line and
# assumes a `clamav` system user this image doesn't create, so a hand-written one is more
# reliable than relying on the package default. DatabaseOwner root is safe here: this whole
# container is a single-tenant, ephemeral Lambda execution environment, not a shared host.
DatabaseMirror database.clamav.net
DatabaseOwner root
# Short, explicit timeouts — without these, a network stall hangs until Lambda's own hard
# function timeout kills it 10 minutes later with zero diagnostic output. With these, a stall
# fails in ~15s with an actual error message we can act on.
ConnectTimeout 10
ReceiveTimeout 15
